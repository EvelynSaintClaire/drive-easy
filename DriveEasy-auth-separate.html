<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c16">
  <title>DriveEasy | Sign in</title>
  <style>
    :root{color-scheme:dark;--bg:#090c16;--card:#111827;--field:#0c1320;--border:#26334a;--text:#f5f7fb;--muted:#91a0b5;--blue:#075cff;--error:#ff8c8c}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
    main{width:min(100%,440px);padding:32px;background:var(--card);border:1px solid var(--border);border-radius:22px}h1{margin:0 0 8px;font-size:26px}p{color:var(--muted)}form{display:grid;gap:18px;margin-top:26px}label{display:grid;gap:7px;color:var(--muted)}input{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--field);color:var(--text);font:inherit}button{padding:14px;border:0;border-radius:12px;background:var(--blue);color:white;font:600 16px system-ui,sans-serif;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#message{min-height:1.5em;margin:0;color:var(--error)}@media(max-width:480px){main{padding:24px}}
  </style>
</head>
<body>
  <main>
    <h1>Sign in to DriveEasy</h1>
    <p>Use your account to continue to the right DriveEasy area.</p>
    <form id="login-form" novalidate>
      <label for="email">Email address<input id="email" name="email" type="email" autocomplete="username" required></label>
      <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="message" role="alert" aria-live="polite"></p>
      <button id="submit" type="submit">Sign in</button>
    </form>
  </main>
  <script>
    // These are public client settings. The Supabase service-role key and admin
    // password must never be placed in a browser file.
    const SUPABASE_URL = "https://yeyqriysxkvahcicrjcu.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-x_pllnySL3G7kNAZT11sw_EGX7bIvU";
    const CUSTOMER_PAGE = "DriveEasy_coustomer side.html";
    // Set this to the actual admin dashboard filename when that page exists.
    const ADMIN_PAGE = "DriveEasy_admin side.html";
    const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const form = document.getElementById("login-form");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");

    function extractUser(payload) {
      // Accept common function response shapes, while requiring the backend to
      // provide a role rather than guessing one from the submitted email.
      return payload?.user ?? payload?.data?.user ?? payload?.data ?? payload;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!EMAIL_PATTERN.test(email)) {
        message.textContent = "Enter a valid email address.";
        return;
      }
      if (!password) {
        message.textContent = "Enter your password.";
        return;
      }

      button.disabled = true;
      button.textContent = "Signing in…";
      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json", apikey: SUPABASE_PUBLISHABLE_KEY },
          body: JSON.stringify({ email, password })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.message || payload.error || `Sign in failed (${response.status}).`);
        }

        const user = extractUser(payload);
        const role = String(user?.role ?? user?.app_metadata?.role ?? "").toLowerCase();
        // Save only a non-sensitive display/role record, never the password.
        // Pages must still verify the session and permissions with the backend.
        if (user?.access_token) sessionStorage.setItem("driveeasy_access_token", user.access_token);
        if (user?.refresh_token) sessionStorage.setItem("driveeasy_refresh_token", user.refresh_token);
        sessionStorage.setItem("driveeasy_user", JSON.stringify({
          id: user?.id ?? user?.user?.id ?? null,
          email: user?.email ?? email,
          role
        }));

        if (role === "admin") {
          window.location.assign(ADMIN_PAGE);
        } else if (["user", "customer", "client"].includes(role)) {
          window.location.assign(CUSTOMER_PAGE);
        } else {
          throw new Error("Sign in succeeded, but the backend did not return a recognized role. Configure the login function to return role: admin or customer.");
        }
      } catch (error) {
        message.textContent = error.message || "Could not sign in. Please try again.";
        button.disabled = false;
        button.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
